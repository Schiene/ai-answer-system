<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI解答システム - カメラ</title>
  <script src="vendor/tailwind.js"></script>
  <script src="socket.io/socket.io.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    #manual-btn { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col overflow-hidden select-none">

  <!-- QRスキャン待ち画面 -->
  <section id="scan-view" class="hidden flex-1 flex flex-col items-center justify-center p-8 gap-5">
    <svg class="w-16 h-16 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
      <path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h2v2h-2zM19 15h2v2h-2zM15 19h2v2h-2zM19 19h2v2h-2z"/>
    </svg>
    <h1 class="text-xl font-bold">AI 解答システム</h1>
    <p class="text-gray-400 text-sm text-center">表示画面のQRコードをスキャンして<br>カメラを接続してください</p>
    <p id="scan-error" class="text-red-400 text-sm text-center hidden"></p>
  </section>

  <!-- カメラビュー -->
  <section id="camera-view" class="hidden flex-1 flex flex-col">

    <!-- ステータスバー -->
    <div class="shrink-0 flex items-center justify-between px-4 py-2 bg-gray-900 border-b border-gray-800">
      <div class="flex items-center gap-2">
        <span id="cam-dot" class="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
        <span id="cam-status" class="text-sm text-gray-300">準備中…</span>
      </div>
      <span id="room-label" class="text-xs font-mono text-gray-500"></span>
    </div>

    <!-- 科目選択バー -->
    <div class="shrink-0 bg-gray-950 border-b border-gray-800 overflow-x-auto no-scrollbar" style="-webkit-overflow-scrolling:touch">
      <div id="subject-bar" class="flex gap-1.5 px-3 py-2 w-max"></div>
    </div>

    <!-- ビデオ + オーバーレイ -->
    <div class="relative flex-1 bg-black overflow-hidden">
      <video id="video" class="w-full h-full object-cover" autoplay playsinline muted></video>

      <!-- ピントヒント -->
      <p class="absolute top-3 inset-x-0 text-center text-xs text-white/40 pointer-events-none">ぼやける場合は画面をタップ</p>

      <!-- 手動送信ボタン（中央大） -->
      <button id="manual-btn" onclick="manualSend()"
        class="absolute inset-0 m-auto w-24 h-24 rounded-full bg-white/15 border-2 border-white/40 flex items-center justify-center active:scale-90 active:bg-white/30 transition-all duration-100">
        <svg class="w-10 h-10 text-white drop-shadow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>

      <!-- カウントダウンオーバーレイ（左下） -->
      <div class="absolute bottom-5 left-4 pointer-events-none">
        <div class="bg-black/60 rounded-2xl px-4 py-2.5 flex items-center gap-3">
          <svg class="w-10 h-10 -rotate-90" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="17" fill="none" stroke="#374151" stroke-width="4"/>
            <circle id="progress-ring" cx="20" cy="20" r="17" fill="none" stroke="#6366f1" stroke-width="4"
              stroke-linecap="round"
              style="stroke-dasharray:107;stroke-dashoffset:107;transition:stroke-dashoffset .2s linear"/>
          </svg>
          <div>
            <p id="countdown-label" class="text-xl font-bold font-mono text-white leading-none">—</p>
            <p id="action-label" class="text-xs text-gray-400 mt-0.5">問題をかざしてください</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 下部サムネイル -->
    <div class="shrink-0 flex items-center gap-3 px-4 py-2.5 bg-gray-900 border-t border-gray-800">
      <div>
        <p class="text-xs text-gray-500 mb-1">最後の送信</p>
        <img id="last-thumb" src="" alt=""
          class="w-16 h-11 object-cover rounded-lg border border-gray-700 bg-gray-800 hidden">
        <div id="thumb-ph" class="w-16 h-11 rounded-lg border border-gray-700 bg-gray-800 flex items-center justify-center">
          <span class="text-gray-600 text-xs">なし</span>
        </div>
      </div>
      <div class="text-sm text-gray-400" id="last-time-label"></div>
    </div>
  </section>

  <script>
    // ── 設定 ──────────────────────────────────────────────────────────────────
    const SEND_MAX_SIDE   = 1280;
    const SEND_QUALITY    = 0.75;
    const DETECT_INTERVAL_MS = 400;
    const DETECT_W = 160;
    const DETECT_H = 120;
    const CHANGE_THRESHOLD = 20;
    const STILL_THRESHOLD  = 8;
    const STILL_FRAMES_REQUIRED = 4;
    const COOLDOWN_MS = 10_000;
    const MAX_UNREADABLE_STREAK = 3;
    const RESULT_WAIT_MS = 60_000;
    const RING_CIRCUMFERENCE = 107;

    // ── 科目リスト ────────────────────────────────────────────────────────────
    const SUBJECTS = [
      '法学', '心理学', '経済学', '経営学', '社会学', '政治学',
      '哲学', '文学', '歴史学', '教育学', '国際関係学',
      '数学', '統計学', '物理学', '化学', '生物学',
      '情報科学', '工学', '医学・看護', '環境学', '福祉学',
    ];
    let currentSubject = localStorage.getItem('aas_subject') || '';

    // ── DOM ───────────────────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const scanView   = $('scan-view');
    const cameraView = $('camera-view');
    const video      = $('video');
    const progressRing   = $('progress-ring');
    const countdownLabel = $('countdown-label');
    const actionLabel    = $('action-label');

    // ── 科目バー描画 ──────────────────────────────────────────────────────────
    function renderSubjectBar() {
      const bar = $('subject-bar');
      bar.innerHTML = '';
      const makeChip = (label, value) => {
        const btn = document.createElement('button');
        const active = currentSubject === value;
        btn.className = `shrink-0 px-3 py-1 rounded-full text-xs font-medium transition-colors ${
          active ? 'bg-indigo-600 text-white' : 'bg-gray-800 text-gray-400 active:bg-gray-700'}`;
        btn.textContent = label;
        btn.onclick = () => selectSubject(value);
        return btn;
      };
      bar.appendChild(makeChip('なし', ''));
      SUBJECTS.forEach(s => bar.appendChild(makeChip(s, s)));
    }

    function selectSubject(value) {
      currentSubject = value;
      localStorage.setItem('aas_subject', value);
      renderSubjectBar();
    }

    renderSubjectBar();

    // ── 状態 ──────────────────────────────────────────────────────────────────
    let socket            = null;
    let roomId            = null;
    let detectTimer       = null;
    let tickTimer         = null;
    let resultWaitTimeout = null;
    let wakeLock          = null;

    let state = 'FIRST';
    let refFrame  = null;
    let prevFrame = null;
    let stillCount = 0;
    let unreadableStreak = 0;
    let cooldownUntil = 0;
    let lastSentFrame = null;

    const detectCanvas = document.createElement('canvas');
    detectCanvas.width  = DETECT_W;
    detectCanvas.height = DETECT_H;
    const detectCtx = detectCanvas.getContext('2d', { willReadFrequently: true });

    // ── QR / URL パラメータ ───────────────────────────────────────────────────
    const urlRoom = new URLSearchParams(location.search).get('room');
    if (urlRoom) {
      window.addEventListener('load', () => setTimeout(() => connectSocket(urlRoom.toUpperCase()), 80));
    } else {
      scanView.classList.remove('hidden');
    }

    // ── Socket接続 ────────────────────────────────────────────────────────────
    function connectSocket(id) {
      roomId = id;
      socket = io({ transports: ['websocket'], path: new URL('socket.io', location.href).pathname });

      let joined = false;

      socket.on('connect', () => socket.emit('join_room', { roomId }));

      socket.on('join_ack', ({ roomId: id }) => {
        joined = true;
        $('room-label').textContent = `Room: ${id}`;
        scanView.classList.add('hidden');
        cameraView.classList.remove('hidden');
        cameraView.classList.add('flex');
        startCamera();
      });

      socket.on('error_occurred', ({ message }) => {
        if (joined) {
          setCamStatus('dot-yellow', '再接続中…');
          setTimeout(() => { if (socket) socket.emit('join_room', { roomId }); }, 3000);
          return;
        }
        scanView.classList.remove('hidden');
        $('scan-error').textContent = message;
        $('scan-error').classList.remove('hidden');
        socket.disconnect();
        socket = null;
      });

      socket.on('disconnect', () => setCamStatus('dot-red', '切断 — 自動再接続中…'));

      socket.on('ai_result_ready', () => {
        clearTimeout(resultWaitTimeout);
        unreadableStreak = 0;
        if (lastSentFrame) refFrame = lastSentFrame;
        enterCooldown(COOLDOWN_MS);
      });

      socket.on('ai_error', ({ unreadable }) => {
        clearTimeout(resultWaitTimeout);
        if (unreadable) {
          unreadableStreak++;
          if (unreadableStreak >= MAX_UNREADABLE_STREAK) {
            if (lastSentFrame) refFrame = lastSentFrame;
            unreadableStreak = 0;
            setCamStatus('dot-yellow', '読み取れません — 問題を写し直してください');
          }
        }
        enterCooldown(COOLDOWN_MS);
      });
    }

    // ── カメラ起動 ────────────────────────────────────────────────────────────
    async function startCamera() {
      setCamStatus('dot-yellow', 'カメラ起動中…');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false,
        });
        video.srcObject = stream;
        await new Promise(r => (video.onloadedmetadata = r));

        // 連続オートフォーカス（Android有効、iOS非対応だが無視される）
        try {
          await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        } catch (_) {}

        // スリープ防止
        await requestWakeLock();

        setCamStatus('dot-green', '撮影中');
        startCaptureLoop();
      } catch (err) {
        setCamStatus('dot-red', 'カメラエラー');
        actionLabel.textContent = err.message;
        countdownLabel.textContent = '—';
      }
    }

    // ── スリープ防止 ──────────────────────────────────────────────────────────
    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } catch (_) {}
    }
    // タブが前面に戻ったとき再取得
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !wakeLock && video.srcObject) {
        requestWakeLock();
      }
    });

    // ── 変化検知ループ ────────────────────────────────────────────────────────
    function startCaptureLoop() {
      state = 'FIRST';
      refFrame = null;
      prevFrame = null;
      stillCount = 0;
      unreadableStreak = 0;
      clearInterval(detectTimer);
      detectTimer = setInterval(detectTick, DETECT_INTERVAL_MS);
      setPanel('—', '問題をかざしてください');
      ringProgress(0);
      emitState('idle');
    }

    function emitState(phase, extra) {
      if (socket && roomId) socket.emit('camera_state', { phase, ...extra });
    }

    function grabFrame() {
      detectCtx.drawImage(video, 0, 0, DETECT_W, DETECT_H);
      const { data } = detectCtx.getImageData(0, 0, DETECT_W, DETECT_H);
      const gray = new Uint8Array(DETECT_W * DETECT_H);
      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        gray[p] = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114) | 0;
      }
      return gray;
    }

    function meanAbsDiff(a, b) {
      if (!a || !b) return 255;
      let sum = 0;
      for (let i = 0; i < a.length; i++) sum += Math.abs(a[i] - b[i]);
      return sum / a.length;
    }

    function detectTick() {
      if (video.readyState < 2 || !socket || !roomId) return;
      if (state === 'SENDING') return;

      if (state === 'COOLDOWN') {
        if (Date.now() < cooldownUntil) return;
        state = refFrame ? 'IDLE' : 'FIRST';
        setCamStatus('dot-green', '待機中');
      }

      const frame = grabFrame();
      const diffPrev = meanAbsDiff(frame, prevFrame);
      prevFrame = frame;

      if (state === 'IDLE') {
        if (meanAbsDiff(frame, refFrame) > CHANGE_THRESHOLD) {
          state = 'SETTLING';
          stillCount = 0;
          setCamStatus('dot-indigo', '変化を検知');
          setPanel('…', '静止を待っています');
          emitState('settling');
        } else {
          setPanel('◎', '同じ問題 — 変えると自動で解きます');
        }
        return;
      }

      if (state === 'FIRST' || state === 'SETTLING') {
        if (diffPrev <= STILL_THRESHOLD) {
          stillCount++;
          setPanel(String(Math.max(1, STILL_FRAMES_REQUIRED - stillCount + 1)), '静止を確認中');
          if (stillCount >= STILL_FRAMES_REQUIRED) sendFrame(frame);
        } else {
          stillCount = 0;
          setPanel('…', state === 'FIRST' ? '問題をかざしてください' : '静止を待っています');
        }
      }
    }

    // ── 送信 ─────────────────────────────────────────────────────────────────
    function sendFrame(frameForRef) {
      state = 'SENDING';
      lastSentFrame = frameForRef;
      stillCount = 0;
      setCamStatus('dot-indigo', 'AI 解析中…');
      setPanel('…', '解析中');
      ringProgress(1);
      setManualBtnState(false);

      const sw = video.videoWidth, sh = video.videoHeight;
      const scale = Math.min(1, SEND_MAX_SIDE / Math.max(sw, sh));
      const canvas = document.createElement('canvas');
      canvas.width  = Math.round(sw * scale);
      canvas.height = Math.round(sh * scale);
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = canvas.toDataURL('image/jpeg', SEND_QUALITY);

      const thumb = $('last-thumb');
      thumb.src = imageData;
      thumb.classList.remove('hidden');
      $('thumb-ph').classList.add('hidden');
      const now = new Date();
      $('last-time-label').textContent =
        `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')} 送信`;

      socket.emit('image_captured', { roomId, imageData, subject: currentSubject }, (ack) => {
        if (ack?.error) { enterCooldown(COOLDOWN_MS); return; }
        clearTimeout(resultWaitTimeout);
        resultWaitTimeout = setTimeout(() => {
          if (state === 'SENDING') {
            setCamStatus('dot-red', '応答がありません — 再試行します');
            enterCooldown(COOLDOWN_MS);
          }
        }, RESULT_WAIT_MS);
      });
    }

    // ── 手動送信 ─────────────────────────────────────────────────────────────
    function manualSend() {
      if (state === 'SENDING' || video.readyState < 2) return;
      clearTimeout(resultWaitTimeout);
      clearInterval(tickTimer);
      // 前の基準をリセットして強制的に「新しい問題」として送る
      const frame = grabFrame();
      sendFrame(frame);
    }

    function setManualBtnState(enabled) {
      const btn = $('manual-btn');
      if (enabled) {
        btn.classList.remove('opacity-30', 'pointer-events-none');
      } else {
        btn.classList.add('opacity-30', 'pointer-events-none');
      }
    }

    // ── クールダウン ──────────────────────────────────────────────────────────
    function enterCooldown(ms) {
      state = 'COOLDOWN';
      cooldownUntil = Date.now() + ms;
      setCamStatus('dot-green', '待機中');
      setManualBtnState(true);
      emitState('cooldown', { ms });
      clearInterval(tickTimer);
      tickTimer = setInterval(() => {
        const remaining = Math.max(0, cooldownUntil - Date.now());
        ringProgress(remaining / ms);
        if (remaining <= 0) {
          clearInterval(tickTimer);
          ringProgress(0);
          setPanel('◎', refFrame ? '同じ問題 — 変えると自動で解きます' : '問題をかざしてください');
          emitState('idle');
        } else {
          setPanel(String(Math.ceil(remaining / 1000)), '次の判定まで');
        }
      }, 100);
    }

    // ── 表示ヘルパー ──────────────────────────────────────────────────────────
    function setPanel(big, small) {
      countdownLabel.textContent = big;
      actionLabel.textContent = small;
    }
    function ringProgress(ratio) {
      progressRing.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - ratio));
    }

    const DOT_COLORS = {
      'dot-yellow': 'bg-yellow-400',
      'dot-green':  'bg-emerald-400',
      'dot-red':    'bg-red-400',
      'dot-indigo': 'bg-indigo-400',
    };
    function setCamStatus(dot, text) {
      $('cam-dot').className = `w-2.5 h-2.5 rounded-full ${DOT_COLORS[dot] || 'bg-gray-500'}`;
      $('cam-status').textContent = text;
    }

    // 初期状態: 手動ボタンは有効
    setManualBtnState(true);
  </script>
</body>
</html>
